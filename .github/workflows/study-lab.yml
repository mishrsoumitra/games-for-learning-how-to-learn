name: Study Lab checks

on:
  push:
    paths: ['study-lab/**', '.github/workflows/study-lab.yml']
  pull_request:
    paths: ['study-lab/**', '.github/workflows/study-lab.yml']
  schedule:
    # Weekly, so a newly published vulnerability in a dependency shows up without a push.
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: study-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: study-lab/package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npx vite build
      - name: End-to-end tests in Chrome
        run: |
          npx playwright install --with-deps chrome
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: study-lab/playwright-report
